[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jwst-reduction"
version = "0.1.0"
description = "Function for JWST data reduction"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "scipy",
    "astropy",
]

readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
